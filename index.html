<section id="revue-presse">
  <h2>📰 Revue de presse – 30 avril 2025 (matin)</h2>
  <p id="synthese"></p>
  <div id="articles"></div>
</section>

<script>
  fetch('revue-presse/revue-2025-04-30-matin.json')
    .then(response => response.json())
    .then(data => {
      document.getElementById('synthese').textContent = data.synthese_generale;

      const container = document.getElementById('articles');
      data.articles.forEach(article => {
        const card = document.createElement('div');
        card.style.border = "1px solid #ccc";
        card.style.margin = "15px 0";
        card.style.padding = "10px";
        card.innerHTML = `
          <img src="${article.image}" alt="" style="width:100%;max-height:300px;object-fit:cover;">
          <h3>${article.titre}</h3>
          <p><strong>${article.source}</strong> — ${article.date}</p>
          <p>${article.resume}</p>
          <a href="${article.url}" target="_blank">Lire l'article complet</a>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      document.getElementById('synthese').textContent = "Impossible de charger la revue de presse.";
      console.error(err);
    });
</script>
