<style>
  .revue-presse {
    margin-top: 40px;
    font-family: Georgia, serif;
  }

  .revue-presse h2 {
    font-size: 28px;
    border-bottom: 2px solid #ccc;
    padding-bottom: 5px;
    margin-bottom: 20px;
  }

  .revue-synthese {
    font-size: 18px;
    color: #444;
    margin-bottom: 30px;
    font-style: italic;
  }

  .revue-article {
    border-bottom: 1px solid #ddd;
    padding: 20px 0;
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .revue-article img {
    width: 240px;
    height: auto;
    border-radius: 4px;
    object-fit: cover;
  }

  .revue-article h3 {
    margin: 0 0 10px;
    font-size: 20px;
    color: #002B5B;
  }

  .revue-meta {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
  }

  .revue-article p {
    margin: 0 0 10px;
    line-height: 1.5;
  }

  .revue-content {
    flex: 1;
  }

  .revue-article a {
    color: #004B4F;
    font-weight: bold;
    text-decoration: none;
  }

  .revue-article a:hover {
    text-decoration: underline;
  }
</style>

<section class="revue-presse">
  <h2>📰 Revue de presse – 30 avril 2025</h2>
  <p class="revue-synthese" id="synthese"></p>
  <div id="articles"></div>
</section>

<script>
  fetch('revue-presse/revue-2025-04-30-matin.json')
    .then(response => response.json())
    .then(data => {
      document.getElementById('synthese').textContent = data.synthese_generale;

      const container = document.getElementById('articles');
      data.articles.forEach(article => {
        const card = document.createElement('div');
        card.className = "revue-article";
        card.innerHTML = `
          <img src="${article.image}" alt="illustration">
          <div class="revue-content">
            <h3>${article.titre}</h3>
            <div class="revue-meta">${article.source} — ${article.date}</div>
            <p>${article.resume}</p>
            <a href="${article.url}" target="_blank">Lire l'article complet</a>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      document.getElementById('synthese').textContent = "Impossible de charger la revue de presse.";
      console.error(err);
    });
</script>
